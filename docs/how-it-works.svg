<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 616 306" width="616" height="306" role="img" aria-label="Three Claude sessions connect to the proxy on 127.0.0.1 over WebSocket. The proxy talks to Chrome over a pipe.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
    .flow { stroke-dasharray: 4 7; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
  </style>
  <rect width="616" height="306" rx="20" fill="#FFFFFF" stroke="#E2E2E5"/>
  <g transform="translate(28 28)">
    <g font-size="13" fill="#1D1D1F">
      <rect x="0" y="20" width="150" height="44" rx="10" fill="#F5F5F4" stroke="#E2E2E5"/><text x="75" y="47" text-anchor="middle">Claude session A</text>
      <rect x="0" y="103" width="150" height="44" rx="10" fill="#F5F5F4" stroke="#E2E2E5"/><text x="75" y="130" text-anchor="middle">Claude session B</text>
      <rect x="0" y="186" width="150" height="44" rx="10" fill="#F5F5F4" stroke="#E2E2E5"/><text x="75" y="213" text-anchor="middle">Claude session C</text>
      <rect x="226" y="88" width="120" height="74" rx="12" fill="#1D1D1F"/><text x="286" y="120" text-anchor="middle" fill="#FFFFFF" font-weight="600">proxy</text><text x="286" y="140" text-anchor="middle" fill="#A1A1A6" font-size="11">127.0.0.1:9410</text>
      <rect x="424" y="78" width="136" height="94" rx="12" fill="#FFFFFF" stroke="#D50000" stroke-width="2"/><rect x="424" y="78" width="136" height="22" rx="10" fill="#D50000"/><text x="492" y="133" text-anchor="middle" font-weight="600">Chrome</text><text x="492" y="152" text-anchor="middle" fill="#6E6E73" font-size="11">your profile copy</text>
    </g>
    <g fill="none" stroke="#6E6E73" stroke-width="2">
      <path class="flow" d="M150 42 C190 42 190 112 226 112"/>
      <path class="flow" d="M150 125 H226"/>
      <path class="flow" d="M150 208 C190 208 190 138 226 138"/>
    </g>
    <path class="flow" d="M346 125 H424" fill="none" stroke="#D50000" stroke-width="3"/>
    <text x="385" y="113" text-anchor="middle" font-size="11" fill="#D50000">pipe</text>
    <text x="188" y="117" text-anchor="middle" font-size="11" fill="#6E6E73">WebSocket</text>
  </g>
</svg>
